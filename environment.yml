# Ambiente del proyecto. Exportado de conda el 2026-08-21.
#
# OJO: votaciones_corte es un ambiente COMPARTIDO con otro proyecto; no se creo
# para este. Este archivo lista todo lo que trae, incluido lo que aqui no se usa.
# Reconstruirlo desde aqui da un ambiente que funciona pero mas gordo que el minimo.
#
# Los builds se omitieron (--no-builds) para que sea menos fragil entre plataformas.
# Aun asi torch quedo en version CPU y varios paquetes vienen de pip, asi que en
# otra maquina puede resolver distinto. Ver HANDOFF.md.
